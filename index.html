        .header-fields {

            gap: 15px;
            margin-bottom: 25px; 
            background: var(--spirit-light); 
            padding: 15px; 
            border-radius: 5px; 
            border: 1px solid var(--spirit-gold); 
        }

        .field-group { display: flex; flex-direction: column; }

        input[type="text"], input[type="number"] {

            font-size: 16px; 
            background: #fff;
            color: #000;
        }

        .section-header {

            padding: 12px 15px; 
            margin-top: 30px; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            border-radius: 4px 4px 0 0; 
            gap: 10px;
            font-weight: bold;
        }

        .section-discount-input input { width: 50px; padding: 5px; border-radius: 3px; border: 1px solid #000; text-align: center; color: #000; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--spirit-light);
            margin-bottom: 5px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.8rem; 
            min-width: 1000px; 
        }

        th { 
            background: var(--spirit-light); 
            color: var(--text-main);
            text-align: center; 
            padding: 6px 4px; 
            border-bottom: 2px solid var(--spirit-gold); 
            font-size: 0.72rem;
            line-height: 1.15;
            vertical-align: middle;
        }

        th.col-product { 
            text-align: left; 
            width: 38%; 
            font-size: 0.85rem;
            color: var(--spirit-gold);
        }

        td { 
            padding: 6px 4px; 
            border-bottom: 1px solid var(--spirit-light); 
            text-align: center; 
            color: var(--text-main);
        }

        td.col-product { 
            text-align: left; 
            white-space: nowrap; 
            font-weight: 600;
        }
        
        input.qty { width: 40px; padding: 4px; text-align: center; font-weight: bold; color: #000; }
        input.disc { width: 35px; padding: 4px; text-align: center; color: #000; }

        .row-total { font-weight: bold; color: var(--spirit-gold); white-space: nowrap; }
        .final-unit-price { font-weight: bold; color: #ff8a80; white-space: nowrap; }
        .unit-price { color: var(--text-muted); white-space: nowrap; }
        .tax-info { color: #a0aec0; font-size: 0.85em; }

        .summary-bar {
            background: var(--spirit-gold); 
            color: #000; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            border-radius: 8px; 
            margin-top: 30px; 
            font-size: 1.1em; 
            font-weight: bold; 
            text-align: center;
        }

        @media (min-width: 600px) {
            .summary-bar { flex-direction: row; justify-content: space-between; text-align: left; }
            h1 { font-size: 2rem; }
        }

        .btn-export { 
            background: #1b4332; 
            color: white; 
            border: 1px solid var(--spirit-gold); 
            padding: 15px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 1em; 
            font-weight: bold; 
            width: 100%;
            margin-bottom: 20px; 
        }

        @media print {

            body { margin: 0; padding: 0; background-color: white; color: black; }
            th { background: #eee !important; color: black !important; border-bottom: 2px solid #000; }
            td { color: black !important; border-bottom: 1px solid #ccc; }
            .table-responsive { overflow: visible; }
            table { min-width: 100%; font-size: 6.5pt; }

            .final-unit-price { color: #d32f2f !important; }
            .unit-price { color: #333 !important; }
            .tax-info { color: #555 !important; }
        }
    </style>
</head>

function renderApp() {
    const container = document.getElementById('sections-container');
    container.innerHTML = ''; 
    let sectionIdx = 0;

    for (const [sectionName, items] of Object.entries(pricingData)) {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-wrapper';
        
        sectionDiv.innerHTML = `
            <div class="section-header">
                <span>${sectionName}</span>
                <div class="section-discount-input no-print">
                    Plošná sleva sekce: <input type="number" class="sec-disc" data-section="${sectionIdx}" value="0" min="0" oninput="updateAll()"> %
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="col-product">Výrobek</th>
                            <th>Objem<br>(L)</th>
                            <th>Bal.<br>(ks)</th>
                            <th>Bez SD<br>(bez DPH)</th>
                            <th>SD<br>(bez DPH)</th>
                            <th>Zákl. cena<br>(bez DPH)</th>
                            <th>Sleva<br>%</th>
                            <th>Po slevě/bal.<br>(bez DPH)</th>
                            <th>Po slevě/ks<br>(bez DPH)</th>
                            <th>Po slevě/bal.<br>(s DPH)</th>
                            <th>Počet</th>
                            <th>Celkem<br>bez DPH</th>
                        </tr>
                    </thead>
                    <tbody id="sec-body-${sectionIdx}"></tbody>
                </table>
            </div>
        `;
        
        container.appendChild(sectionDiv);
        const tbody = document.getElementById(`sec-body-${sectionIdx}`);

        items.forEach((item, itemIdx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-product">${item.name}</td>
                <td>${item.vol}</td>
                <td>${item.pack}</td>
                <td class="unit-price base-no-tax">0.00</td>
                <td class="tax-info tax-val">0.00</td>
                <td>${item.price.toFixed(2)}</td>
                <td><input type="number" class="item-disc disc" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
                <td class="final-pack-price">0.00</td>
                <td class="final-unit-price">0.00</td>
                <td class="unit-price final-vat-price">0.00</td>
                <td><input type="number" class="qty" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
                <td class="row-total">0.00</td>
            `;
            tbody.appendChild(tr);
        });
        sectionIdx++;
    }
    updateAll();
}

function updateAll() {
    let grandTotalQty = 0;
    let grandTotalPrice = 0;
    let grandTotalVat = 0;

    const sections = document.querySelectorAll('.section-wrapper');
    sections.forEach((sec, sIdx) => {
        const secDisc = parseFloat(sec.querySelector('.sec-disc').value) || 0;
        const rows = sec.querySelectorAll('tbody tr');
        
        rows.forEach((row, iIdx) => {
            const sectionKey = Object.keys(pricingData)[sIdx];
            const itemData = pricingData[sectionKey][iIdx];
            
            const itemDisc = parseFloat(row.querySelector('.item-disc').value) || 0;
            const qty = parseInt(row.querySelector('.qty').value) || 0;

            const totalDisc = Math.min(100, secDisc + itemDisc);
            const discFactor = (1 - totalDisc / 100);

            const basePriceNoTaxDisc = itemData.basePriceNoTax * discFactor;
            const taxValDisc = itemData.tax * discFactor;
            const finalPackPrice = itemData.price * discFactor;
            const finalUnitPrice = finalPackPrice / itemData.pack;
            const finalPackVat = itemData.priceVat * discFactor;

            const rowTotal = finalPackPrice * qty;
            const rowTotalVat = finalPackVat * qty;

            row.querySelector('.base-no-tax').innerText = basePriceNoTaxDisc.toFixed(2);
            row.querySelector('.tax-val').innerText = taxValDisc.toFixed(2);
            row.querySelector('.final-pack-price').innerText = finalPackPrice.toFixed(2);
            row.querySelector('.final-unit-price').innerText = finalUnitPrice.toFixed(2);
            row.querySelector('.final-vat-price').innerText = finalPackVat.toFixed(2);
            row.querySelector('.row-total').innerText = rowTotal.toFixed(2);

            grandTotalQty += qty;
            grandTotalPrice += rowTotal;
            grandTotalVat += rowTotalVat;
        });
    });

    document.getElementById('grand-total-qty').innerText = grandTotalQty;
    document.getElementById('grand-total-price').innerText = grandTotalPrice.toLocaleString('cs-CZ', {minimumFractionDigits: 2});
    document.getElementById('grand-total-vat').innerText = grandTotalVat.toLocaleString('cs-CZ', {minimumFractionDigits: 2});
}

function exportPDF() {
    const element = document.getElementById('app-content');
    const opt = {
        margin:       [10, 5, 10, 5],
        filename:     'Cenik_Premium_Spirits_2026.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(element).save();
}
